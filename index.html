<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura a gatinha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-page: #050505;
            --primary: #ffffff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-bg: rgba(15, 15, 15, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.20;
            background-color: #050505; 
            filter: blur(5px);
            transition: filter 1s ease;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.6em; font-weight: 600; cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            letter-spacing: 2px;
        }

        .start-overlay span {
            animation: pulse-start 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
            display: flex; align-items: center; gap: 12px;
        }

        @keyframes pulse-start {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        }

        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            gap: 20px;
            box-shadow: 0 30px 60px var(--glass-shadow);
            opacity: 0;
            transform: translateY(40px);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatCard 6s ease-in-out infinite 1s;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            margin-bottom: 5px;
        }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 2;
            background-color: #2c2f33;
        }

        .discord-decoration {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            z-index: 3; pointer-events: none; display: none;
        }

        .avatar-container:hover .avatar {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 2.4em;
            font-weight: 800;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
        }

        .discord-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #747f8d; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95em;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 25px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .tags {
            display: flex;
            justify-content: center; 
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255
