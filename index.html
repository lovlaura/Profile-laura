<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura | Perfil</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-page: #050505;
            --primary: #ffffff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-bg: rgba(10, 10, 10, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.25;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.5em; font-weight: 600; cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .start-overlay span {
            animation: pulse-start 2s infinite;
            display: flex; align-items: center; gap: 10px;
        }

        @keyframes pulse-start {
            0%, 100% { opacity: 0.6; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 15px rgba(255,255,255,0.8); }
        }

        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 40px 50px;
            width: 90%;
            max-width: 750px;
            
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 40px;
            
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 1s ease-out forwards;
            animation-delay: 0.5s;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            flex-shrink: 0;
        }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative; z-index: 2;
        }

        .discord-decoration {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            z-index: 3; pointer-events: none; display: none;
        }

        .avatar-container:hover .avatar {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            width: 100%;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        h1 i { color: var(--primary); font-size: 0.8em; }

        .bio {
            color: var(--text-muted);
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .tags {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tag {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tag:hover {
            color: var(--text-main);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .links-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: center;
        }

        .icon-link {
            color: #ffffff;
            font-size: 2.8em;
            text-decoration: none;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
        }

        .icon-link:hover {
            transform: scale(1.15) translateY(-3px);
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 1));
        }

        @media (max-width: 650px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 40px 20px;
                gap: 20px;
            }
            .content-area {
                align-items: center;
            }
            .tags {
                justify-content: center;
            }
        }

        .audio-control {
            position: fixed; bottom: 20px; right: 20px;
            width: 45px; height: 45px;
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; color: rgba(255,255,255,0.7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2em; cursor: pointer; backdrop-filter: blur(5px);
            transition: all 0.3s ease; z-index: 1000; opacity: 0; visibility: hidden;
        }

        .audio-control:hover { 
            color: #fff; border-color: #fff; 
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .audio-control.visible { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <div id="start-overlay" class="start-overlay">
        <span><i class="ph-fill ph-play-circle"></i> enter</span>
    </div>

    <video loop muted playsinline id="bg-video" class="bg-video">
        <source src="https://files.catbox.moe/pjcxqv.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/xv5rzt.mp3" type="audio/mpeg">
    </audio>
    
    <button id="audio-btn" class="audio-control" title="Pausar/Tocar">
        <i id="audio-icon" class="ph-fill ph-speaker-high"></i>
    </button>

    <div class="profile-card">
        
        <div class="avatar-container">
            <img id="discord-avatar" alt="Avatar" class="avatar" src="https://i.imgur.com/l4U30Qzl.jpg">
            <img id="discord-decoration" alt="Moldura" class="discord-decoration" src="">
        </div>
        
        <div class="content-area">
            <h1>Laura</h1>
            <p class="bio">loneliness</p>

            <div class="tags">
                <div class="tag"><i class="ph-fill ph-gender-transgender"></i> Transgênero</div>
                <div class="tag"><i class="ph-fill ph-star"></i> Bissexual</div>
            </div>

            <div class="links-container">
                <a href="https://instagram.com/l4ahzy" target="_blank" class="icon-link">
                    <i class="ph-fill ph-instagram-logo"></i>
                </a>
                
                <a href="#" target="_blank" class="icon-link">
                    <i class="ph-fill ph-discord-logo"></i>
                </a>
                <a href="#" target="_blank" class="icon-link">
                    <i class="ph-fill ph-spotify-logo"></i>
                </a>
                <a href="#" target="_blank" class="icon-link">
                    <i class="ph-fill ph-steam-logo"></i>
                </a>
            </div>
        </div>

    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const music = document.getElementById('bg-music');
        const video = document.getElementById('bg-video');
        const audioBtn = document.getElementById('audio-btn');
        const audioIcon = document.getElementById('audio-icon');
        let isPlaying = false;

        overlay.addEventListener('click', function() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.visibility = 'hidden', 800);
            
            audioBtn.classList.add('visible');
            music.volume = 0.3;
            
            music.currentTime = 0;
            video.currentTime = 0;

            video.play();
            music.play().then(() => {
                isPlaying = true;
            }).catch(() => {
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            });
        });

        audioBtn.addEventListener('click', function() {
            if (isPlaying) {
                music.pause();
                video.pause();
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            } else {
                music.play();
                video.play();
                audioIcon.classList.replace('ph-speaker-slash', 'ph-speaker-high');
            }
            isPlaying = !isPlaying;
        });

        const discordId = '1052662634085892188'; 

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data.discord_user;
                    
                    const isGif = user.avatar && user.avatar.startsWith('a_'); 
                    const extension = isGif ? 'gif' : 'png';
                    
                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    const decorationImg = document.getElementById('discord-decoration');
                    if (user.avatar_decoration_data && user.avatar_decoration_data.asset) {
                        const asset = user.avatar_decoration_data.asset;
                        decorationImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=256`;
                        decorationImg.style.display = 'block'; 
                    }
                }
            } catch (error) {
                
            }
        }

        fetchDiscordData();
    </script>
</body>
</html>
