<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura a gatinha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-page: #050505;
            --primary: #ffffff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-bg: rgba(15, 15, 15, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.20;
            background-color: #050505; 
            filter: blur(5px);
            transition: filter 1s ease;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            color: var(--primary); font-size: 1.6em; font-weight: 600; cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            letter-spacing: 2px;
        }

        .start-overlay span {
            animation: pulse-start 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
            display: flex; align-items: center; gap: 12px;
        }

        @keyframes pulse-start {
            0%, 100% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        }

        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            gap: 20px;
            box-shadow: 0 30px 60px var(--glass-shadow);
            opacity: 0;
            transform: translateY(40px);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards, floatCard 6s ease-in-out infinite 1s;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            margin-bottom: 5px;
        }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 2;
            background-color: #2c2f33;
        }

        .discord-decoration {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            z-index: 3; pointer-events: none; display: none;
        }

        .avatar-container:hover .avatar {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.15);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 2.4em;
            font-weight: 800;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: -0.5px;
        }

        .discord-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #747f8d; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95em;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 25px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .tags {
            display: flex;
            justify-content: center; 
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            transition: all 0.3s ease;
            cursor: default;
            backdrop-filter: blur(5px);
        }

        .tag i {
            color: #8c8c8c;
            font-size: 1.1em;
        }

        .tag:hover {
            color: var(--text-main);
            border-color: rgba(255,255,255,0.3);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .links-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: center;
            justify-content: center; 
        }

        .icon-link {
            color: #8c8c8c;
            font-size: 2.5em;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .icon-link::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: currentColor;
            border-radius: 50%;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            transition: transform 0.3s ease;
            opacity: 0.5;
            filter: blur(4px);
        }

        .icon-link:hover {
            color: #d9d9d9;
            transform: scale(1.15) translateY(-5px);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .icon-link:hover::after {
            transform: translateX(-50%) scale(1);
        }

        .audio-control {
            position: fixed; bottom: 30px; right: 30px;
            width: 50px; height: 50px;
            background: rgba(10, 10, 10, 0.5); 
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%; color: rgba(255,255,255,0.7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.3s ease; z-index: 1000; opacity: 0; visibility: hidden;
            transform: translateY(20px);
        }

        .audio-control:hover { 
            color: #fff; 
            border-color: rgba(255,255,255,0.5); 
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1) translateY(0);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .audio-control.visible { 
            opacity: 1; 
            visibility: visible; 
            transform: translateY(0);
        }

        .view-counter {
            position: fixed; 
            bottom: 30px; 
            left: 30px; 
            background: rgba(10, 10, 10, 0.5); 
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; 
            color: rgba(255,255,255,0.7);
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 1.1em; 
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease; 
            z-index: 1000; 
            opacity: 0; 
            visibility: hidden;
            transform: translateY(20px);
            letter-spacing: 1px;
        }

        .view-counter:hover { 
            color: #fff; 
            border-color: rgba(255,255,255,0.5); 
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px); 
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .view-counter.visible { 
            opacity: 1; 
            visibility: visible; 
            transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .toast i {
            color: var(--text-main);
            font-size: 1.3em;
        }

    </style>
</head>
<body>

    <div id="start-overlay" class="start-overlay">
        <span><i class="ph-fill ph-play-circle"></i> enter</span>
    </div>

    <video loop muted playsinline id="bg-video" class="bg-video">
        <source src="https://files.catbox.moe/07yiov.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/kx3f8c.mp3" type="audio/mpeg">
    </audio>
    
    <div id="view-counter" class="view-counter" title="views">
        <i class="ph-fill ph-eye"></i>
        <span id="view-count">-</span>
    </div>

    <button id="audio-btn" class="audio-control" title="audio">
        <i id="audio-icon" class="ph-fill ph-speaker-high"></i>
    </button>

    <main class="profile-card">
        
        <div class="avatar-container">
            <img id="discord-avatar" alt="avatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/1.png">
            <img id="discord-decoration" alt="decor" class="discord-decoration" src="">
        </div>
        
        <div class="content-area">
            <h1>Laura</h1>
            
            <div id="discord-status-container" class="discord-status">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">loading...</span>
            </div>

            <p class="bio">She's a Killer Queen</p>

            <div class="tags">
                <div class="tag"><i class="ph-fill ph-star"></i> Ela/Dela</div>
            </div>

            <nav class="links-container">
                <a href="https://instagram.com/gatinamalvada" target="_blank" class="icon-link insta" aria-label="ig">
                    <i class="ph-fill ph-instagram-logo"></i>
                </a>
                
                <a href="#" id="copy-discord" class="icon-link discord" aria-label="discord" title="copy">
                    <i class="ph-fill ph-discord-logo"></i>
                </a>

                <a href="https://onlyfans.wtf/gatinhalaura" target="_blank" class="icon-link custom-link" aria-label="" title="Onlyfans">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="currentColor" d="M24 4.003h-4.015c-3.45 0-5.3.197-6.748 1.957a7.996 7.996 0 1 0 2.103 9.211c3.182-.231 5.39-2.134 6.085-5.173c0 0-2.399.585-4.43 0c4.018-.777 6.333-3.037 7.005-5.995M5.61 11.999A2.391 2.391 0 0 1 9.28 9.97a2.966 2.966 0 0 1 2.998-2.528h.008c-.92 1.778-1.407 3.352-1.998 5.263A2.392 2.392 0 0 1 5.61 12Zm2.386-7.996a7.996 7.996 0 1 0 7.996 7.996a7.996 7.996 0 0 0-7.996-7.996m0 10.394A2.399 2.399 0 1 1 10.395 12a2.396 2.396 0 0 1-2.399 2.398Z" />
                    </svg>
                </a>
            </nav>
        </div>

    </main>

    <div id="toast" class="toast">
        <i class="ph-fill ph-check-circle"></i> copiado!
    </div>

    <script>
        const overlay = document.getElementById('start-overlay');
        const music = document.getElementById('bg-music');
        const video = document.getElementById('bg-video');
        const audioBtn = document.getElementById('audio-btn');
        const audioIcon = document.getElementById('audio-icon');
        const viewCounter = document.getElementById('view-counter');
        const viewCountText = document.getElementById('view-count');
        let isPlaying = false;

        async function updateViewCount() {
            try {
                const ultimaVisitaStr = localStorage.getItem('ultima_visita_laura');
                const agora = new Date().getTime();
                const tempoEspera = 3 * 60 * 60 * 1000; 
                
                let deveContarMaisUm = false;

                if (!ultimaVisitaStr || (agora - parseInt(ultimaVisitaStr)) > tempoEspera) {
                    deveContarMaisUm = true;
                }

                if (deveContarMaisUm) {
                    const response = await fetch('https://api.counterapi.dev/v1/lauracastles-site/views/up');
                    const data = await response.json();
                    
                    if (data.count) {
                        viewCountText.innerText = data.count;
                        localStorage.setItem('ultima_visita_laura', agora.toString());
                    }
                } else {
                    const response = await fetch('https://api.counterapi.dev/v1/lauracastles-site/views');
                    const data = await response.json();
                    
                    if (data.count) {
                        viewCountText.innerText = data.count;
                    }
                }
            } catch (error) {
                console.error('erro: views', error);
                viewCountText.innerText = 'err';
            }
        }

        function fadeInAudio(audioObj, targetVolume, duration) {
            audioObj.volume = 0;
            const step = targetVolume / (duration / 50);
            const fadeInterval = setInterval(() => {
                if (audioObj.volume + step < targetVolume) {
                    audioObj.volume += step;
                } else {
                    audioObj.volume = targetVolume;
                    clearInterval(fadeInterval);
                }
            }, 50);
        }

        overlay.addEventListener('click', function() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.visibility = 'hidden', 800);
            video.style.filter = 'blur(5px)';
            
            audioBtn.classList.add('visible');
            viewCounter.classList.add('visible'); 
            
            updateViewCount(); 
            
            music.currentTime = 0;
            video.currentTime = 0;
            video.play();
            music.play().then(() => {
                isPlaying = true;
                fadeInAudio(music, 0.3, 2000); 
            }).catch(() => {
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            });
        });

        audioBtn.addEventListener('click', function() {
            if (isPlaying) {
                music.pause();
                video.pause();
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            } else {
                music.play();
                video.play();
                audioIcon.classList.replace('ph-speaker-slash', 'ph-speaker-high');
            }
            isPlaying = !isPlaying;
        });

        const discordBtn = document.getElementById('copy-discord');
        const toast = document.getElementById('toast');
        let toastTimeout;

        discordBtn.addEventListener('click', function(e) {
            e.preventDefault();
            navigator.clipboard.writeText('gatinhalaura').then(() => {
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }).catch(err => {
                console.error('erro: copy', err);
            });
        });

        const discordId = '1052662634085892188'; 

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data.discord_user;
                    const lanyardData = data.data;
                    
                    const isGif = user.avatar && user.avatar.startsWith('a_'); 
                    const extension = isGif ? 'gif' : 'png';
                    
                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    const decorationImg = document.getElementById('discord-decoration');
                    if (user.avatar_decoration_data && user.avatar_decoration_data.asset) {
                        const asset = user.avatar_decoration_data.asset;
                        decorationImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=256`;
                        decorationImg.style.display = 'block'; 
                    }

                    const statusDot = document.getElementById('status-dot');
                    const statusText = document.getElementById('status-text');
                    
                    let statusColor = '#747f8d'; 
                    let statusString = 'offline';

                    if (lanyardData.discord_status === 'online') { statusColor = '#23a559'; statusString = 'online'; }
                    else if (lanyardData.discord_status === 'idle') { statusColor = '#f0b232'; statusString = 'idle'; }
                    else if (lanyardData.discord_status === 'dnd') { statusColor = '#f23f42'; statusString = 'dnd'; }

                    if (lanyardData.listening_to_spotify) {
                        statusString = 'spotify';
                        statusColor = '#1DB954';
                        statusText.innerHTML = `<i class="ph-fill ph-spotify-logo" style="color: #1DB954"></i> ${statusString}`;
                    } else if (lanyardData.activities && lanyardData.activities.length > 0) {
                        const game = lanyardData.activities.find(a => a.type === 0); 
                        if (game) {
                            statusString = `jogando ${game.name}`;
                            statusText.innerText = statusString;
                        } else {
                            statusText.innerText = statusString;
                        }
                    } else {
                        statusText.innerText = statusString;
                    }
                    
                    if (!lanyardData.listening_to_spotify) {
                        statusText.style.color = "var(--text-muted)";
                    }

                    statusDot.style.backgroundColor = statusColor;
                    statusDot.style.boxShadow = `0 0 8px ${statusColor}`;
                }
            } catch (error) {
                console.warn("erro: lanyard");
                document.getElementById('status-text').innerText = 'offline';
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);

    </script>
</body>
</html>
