<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura a gatinha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #888888;
            --bg-dark: #030303;
            --neon-green: #4ade80;
            --neon-green-glow: rgba(130, 255, 0, 0.35);
            --rotX: 0deg;
            --rotY: 0deg;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .cursor {
            width: 8px;
            height: 8px;
            background-color: var(--text-main);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out, background-color 0.15s ease-out;
        }
        
        .cursor.hovered {
            transform: translate(-50%, -50%) scale(2.5);
            background-color: var(--neon-green);
        }

        .bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100vw; min-height: 100vh;
            z-index: -3;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.25; 
            filter: grayscale(20%); 
            transition: opacity 2s ease;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(3,3,3,1) 5%, rgba(3,3,3,0.2) 50%, rgba(3,3,3,0.7) 100%);
            z-index: -2;
        }

        .bg-glow-radial {
            position: fixed;
            top: 50%; left: 50%; width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at center, rgba(110,255,0,0.1), transparent 50%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.3; 
            filter: blur(20px);
        }

        .start-overlay {
            position: fixed; inset: 0;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            font-size: 1.2em; font-weight: 200; letter-spacing: 0.5em;
            transition: opacity 1.5s ease, visibility 1.5s ease;
            text-transform: uppercase;
        }
        
        .start-overlay:hover { 
            color: var(--neon-green); 
            text-shadow: 0 0 8px var(--neon-green-glow); 
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
            gap: 20px;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            transform-style: preserve-3d;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95) translateY(20px) rotateX(0deg) rotateY(0deg);
            transition: opacity 2s ease, transform 0.2s ease-out; 
        }
        
        .main-content.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0) rotateX(var(--rotX)) rotateY(var(--rotY));
        }

        .card-bg {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(18,18,18,.58), rgba(8,8,8,.72));
            border: 1px solid rgba(120,255,0,.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .card-bg::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
        }

        .main-content.visible .card-bg::after {
            animation: shine 1.5s ease-out 1.2s forwards;
        }
        
        @keyframes shine {
            to { left: 200%; }
        }

        .decor {
            position: absolute;
            color: var(--neon-green);
            opacity: 0.4;
            font-size: 0.8rem;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
        }
        
        .decor.top-left { top: 20px; left: 20px; }
        .decor.top-right { top: 20px; right: 20px; }
        .decor.bottom-left { 
            bottom: 25px; 
            left: 25px; 
            width: 14px; 
            height: 1px; 
            background-color: var(--neon-green); 
        }

        .main-content > *:not(.card-bg):not(.decor) {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        
        .main-content.visible > *:nth-child(5) { transition-delay: 0.1s; opacity: 1; transform: translateY(0); }
        .main-content.visible > *:nth-child(6) { transition-delay: 0.3s; opacity: 1; transform: translateY(0); }
        .main-content.visible > *:nth-child(7) { transition-delay: 0.5s; opacity: 1; transform: translateY(0); }
        .main-content.visible > *:nth-child(8) { transition-delay: 0.7s; opacity: 1; transform: translateY(0); }
        .main-content.visible > *:nth-child(9) { transition-delay: 0.9s; opacity: 1; transform: translateY(0); }
        .main-content.visible > *:nth-child(10) { transition-delay: 1.1s; opacity: 1; transform: translateY(0); }

        @keyframes slowBreathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        
        .avatar-container {
            position: relative;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #98ff00, #4ade80);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(130, 255, 0, 0.15);
            animation: slowBreathe 8s infinite ease-in-out;
            margin-bottom: 5px;
        }
        
        .avatar {
            width: calc(100% - 6px);
            height: calc(100% - 6px);
            border-radius: 50%;
            object-fit: cover;
            transition: filter 0.4s ease, transform 0.4s ease;
            filter: grayscale(15%);
        }
        
        .avatar-container:hover .avatar { 
            filter: grayscale(0%); 
        }
        
        .discord-decoration {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.15);
            width: 150px; height: 150px;
            z-index: 3; pointer-events: none; display: none;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 500;
            letter-spacing: 8px;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 3px rgba(130, 255, 0, 0.2);
        }

        .subtitle {
            font-family: 'Quicksand', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            line-height: 1.6;
        }
        
        .subtitle span {
            font-size: 0.7em;
            letter-spacing: 0.5em;
            color: var(--neon-green);
            opacity: 0.8;
        }

        .status-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: -15px;
        }
        
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: background-color 0.3s;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
        
        .status-dot.online {
            background-color: var(--neon-green) !important;
            animation: pulse 2s infinite;
        }
        
        .status-text {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: lowercase;
        }

        .tag-simple {
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 5px 14px;
            border-radius: 50px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 5px;
        }
        
        .tag-simple:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 8px rgba(130, 255, 0, 0.15);
        }

        .links-row {
            display: flex;
            gap: 40px;
            margin-top: 10px;
        }
        
        .link-icon {
            color: var(--text-main);
            font-size: 42px; 
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: inline-block;
        }
        
        .link-icon:hover {
            color: var(--neon-green);
            transform: scale(1.1) translateY(-3px);
            filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.5));
        }

        .side-details {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 50px;
            color: rgba(255, 255, 255, 0.18);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 5px;
            writing-mode: vertical-rl;
            pointer-events: none;
            z-index: 1;
        }

        .corner-controls {
            position: fixed;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 50px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease 1s;
        }
        
        .corner-controls.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .control-btn {
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        
        .control-btn:hover { color: var(--neon-green); }
        
        .clock {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .clock span { color: var(--neon-green); opacity: 0.8;}

        .music-player-mini {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }
        
        .progress-line {
            width: 80px;
            height: 1px;
            background: rgba(255,255,255,0.2);
            position: relative;
        }
        
        .progress-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: var(--neon-green);
            width: 0%;
            box-shadow: 0 0 5px var(--neon-green-glow);
        }
        
        .progress-dot {
            position: absolute;
            top: -2.5px;
            right: -2.5px;
            width: 6px; height: 6px;
            background: var(--neon-green);
            border-radius: 50%;
        }

        .toast {
            position: fixed;
            top: 40px; left: 50%;
            transform: translate(-50%, -20px);
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            color: var(--neon-green);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 9999;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        
        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
            visibility: visible;
        }

    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <div id="start-overlay" class="start-overlay">
        <span>Click to enter</span>
    </div>

    <video loop muted playsinline id="bg-video" class="bg-video">
        <source src="https://files.catbox.moe/07yiov.mp4" type="video/mp4">
    </video>
    <div class="bg-gradient"></div>
    <div class="bg-glow-radial"></div>
    
    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/kx3f8c.mp3" type="audio/mpeg">
    </audio>

    <div class="side-details">
        <div>01</div>
        <div>PROFILE</div>
        <div>ONLINE</div>
    </div>

    <div class="corner-controls" id="corner-controls">
        <div class="control-group">
            <div class="clock">
                <i class="ph ph-clock"></i>
                <div id="time-display">--:--</div>
                <span>UTC-3</span>
            </div>
            <div class="control-btn" title="views">
                <i class="ph ph-eye"></i>
                <span id="view-count">-</span>
            </div>
        </div>

        <div class="control-group" style="align-items: flex-end;">
            <div class="control-btn interactive" id="audio-btn" title="Mute/Unmute" style="font-size: 1.4rem;">
                <i id="audio-icon" class="ph ph-speaker-high"></i>
            </div>
            <div class="music-player-mini">
                <span id="music-current">0:00</span>
                <div class="progress-line">
                    <div class="progress-fill" id="music-progress">
                        <div class="progress-dot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="main-content" id="main-content">
        
        <div class="card-bg"></div>
        <div class="decor top-left">+</div>
        <div class="decor top-right">✦</div>
        <div class="decor bottom-left"></div>

        <div class="avatar-container interactive">
            <img id="discord-avatar" alt="avatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/1.png">
            <img id="discord-decoration" alt="decor" class="discord-decoration" src="">
        </div>
        
        <h1>Laura</h1>
        
        <div class="status-wrapper">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text" class="status-text">loading...</span>
        </div>

        <p class="subtitle">
            Why can't I<br>move on forward?<br>
            <span>✦ 1991 ✦</span>
        </p>

        <div class="tag-simple interactive">Ela / Dela</div>

        <nav class="links-row">
            <a href="https://instagram.com/gatinamalvada" target="_blank" class="link-icon interactive" aria-label="Instagram">
                <i class="ph ph-instagram-logo"></i>
            </a>
            <a href="#" id="copy-discord" class="link-icon interactive" aria-label="Discord" title="Copiar usuário">
                <i class="ph ph-discord-logo"></i>
            </a>
        </nav>

    </main>

    <div id="toast" class="toast">
        Copiado
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const interactives = document.querySelectorAll('.interactive, a, .control-btn');
        interactives.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        const root = document.documentElement;
        document.addEventListener('mousemove', (e) => {
            const main = document.getElementById('main-content');
            if(main.classList.contains('visible')) {
                const x = (window.innerWidth / 2 - e.pageX) / 45; 
                const y = (window.innerHeight / 2 - e.pageY) / 45; 
                
                root.style.setProperty('--rotY', `${-x}deg`);
                root.style.setProperty('--rotX', `${y}deg`);
            }
        });
        document.addEventListener('mouseleave', () => {
            root.style.setProperty('--rotY', '0deg');
            root.style.setProperty('--rotX', '0deg');
        });

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false };
            document.getElementById('time-display').innerText = now.toLocaleTimeString('pt-BR', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const overlay = document.getElementById('start-overlay');
        const mainContent = document.getElementById('main-content');
        const cornerControls = document.getElementById('corner-controls');
        
        const music = document.getElementById('bg-music');
        const video = document.getElementById('bg-video');
        const audioBtn = document.getElementById('audio-btn');
        const audioIcon = document.getElementById('audio-icon');
        const viewCountText = document.getElementById('view-count');
        const musicProgress = document.getElementById('music-progress');
        const musicCurrent = document.getElementById('music-current');
        let isPlaying = false;

        function fadeInAudio(audioObj, targetVolume, duration) {
            audioObj.volume = 0;
            const step = targetVolume / (duration / 50);
            const fadeInterval = setInterval(() => {
                if (audioObj.volume + step < targetVolume) {
                    audioObj.volume += step;
                } else {
                    audioObj.volume = targetVolume;
                    clearInterval(fadeInterval);
                }
            }, 50);
        }

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        music.addEventListener('timeupdate', () => {
            if(music.duration) {
                const percent = (music.currentTime / music.duration) * 100;
                musicProgress.style.width = `${percent}%`;
                musicCurrent.innerText = formatTime(music.currentTime);
            }
        });

        overlay.addEventListener('click', function() {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 1500);
            
            mainContent.style.transition = 'opacity 2s ease, transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
            mainContent.classList.add('visible');
            cornerControls.classList.add('visible');
            
            setTimeout(() => {
                mainContent.style.transition = 'opacity 0.2s, transform 0.2s ease-out, box-shadow 0.2s ease';
            }, 1600);
            
            updateViewCount(); 
            
            music.currentTime = 0;
            video.currentTime = 0;
            video.play();
            music.play().then(() => {
                isPlaying = true;
                fadeInAudio(music, 0.4, 2000); 
            }).catch(() => {
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            });
        });

        audioBtn.addEventListener('click', function() {
            if (isPlaying) {
                music.pause();
                audioIcon.classList.replace('ph-speaker-high', 'ph-speaker-slash');
            } else {
                music.play();
                audioIcon.classList.replace('ph-speaker-slash', 'ph-speaker-high');
            }
            isPlaying = !isPlaying;
        });

        async function updateViewCount() {
            try {
                const ultimaVisitaStr = localStorage.getItem('ultima_visita_laura');
                const agora = new Date().getTime();
                const tempoEspera = 3 * 60 * 60 * 1000; 
                let deveContarMaisUm = false;

                if (!ultimaVisitaStr || (agora - parseInt(ultimaVisitaStr)) > tempoEspera) {
                    deveContarMaisUm = true;
                }

                if (deveContarMaisUm) {
                    const response = await fetch('https://api.counterapi.dev/v1/lauracastles-site/views/up');
                    const data = await response.json();
                    if (data.count) {
                        viewCountText.innerText = data.count;
                        localStorage.setItem('ultima_visita_laura', agora.toString());
                    }
                } else {
                    const response = await fetch('https://api.counterapi.dev/v1/lauracastles-site/views');
                    const data = await response.json();
                    if (data.count) viewCountText.innerText = data.count;
                }
            } catch (error) {
                viewCountText.innerText = 'err';
            }
        }

        const discordBtn = document.getElementById('copy-discord');
        const toast = document.getElementById('toast');
        let toastTimeout;

        discordBtn.addEventListener('click', function(e) {
            e.preventDefault();
            navigator.clipboard.writeText('gatinhalaura').then(() => {
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            });
        });

        const discordId = '1052662634085892188'; 

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data.discord_user;
                    const lanyardData = data.data;
                    
                    const isGif = user.avatar && user.avatar.startsWith('a_'); 
                    const extension = isGif ? 'gif' : 'png';
                    
                    if (user.avatar) {
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${extension}?size=512`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    const decorationImg = document.getElementById('discord-decoration');
                    if (user.avatar_decoration_data && user.avatar_decoration_data.asset) {
                        const asset = user.avatar_decoration_data.asset;
                        decorationImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${asset}.png?size=256`;
                        decorationImg.style.display = 'block'; 
                    }

                    const statusDot = document.getElementById('status-dot');
                    const statusText = document.getElementById('status-text');
                    
                    let statusColor = '#555555'; 
                    let statusString = 'offline';
                    
                    statusDot.classList.remove('online');

                    if (lanyardData.discord_status === 'online') { 
                        statusColor = '#4ade80'; 
                        statusString = 'online agora';
                        statusDot.classList.add('online');
                    }
                    else if (lanyardData.discord_status === 'idle') { statusColor = '#f0b232'; statusString = 'ausente'; }
                    else if (lanyardData.discord_status === 'dnd') { statusColor = '#f23f42'; statusString = 'não perturbe'; }

                    if (lanyardData.listening_to_spotify) {
                        statusString = 'ouvindo spotify'; 
                        statusColor = '#1DB954';
                        statusText.innerHTML = `<i class="ph ph-spotify-logo" style="color: #1DB954"></i> ${statusString}`;
                    } else if (lanyardData.activities && lanyardData.activities.length > 0) {
                        const game = lanyardData.activities.find(a => a.type === 0); 
                        if (game) statusString = `jogando ${game.name.toLowerCase()}`;
                        statusText.innerText = statusString;
                    } else {
                        statusText.innerText = statusString;
                    }
                    
                    statusDot.style.backgroundColor = statusColor;
                }
            } catch (error) {
                document.getElementById('status-text').innerText = 'offline';
            }
        }

        fetchDiscordData();
        setInterval(fetchDiscordData, 10000);
    </script>
</body>
</html>
